name: checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  # A required check: renamed from `conventions` so it does not share a name
  # with build.yml's job.
  docs-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ADR-0051 §6: a convention in docs/agents/ ships with a checker.
      - name: Shared agent instructions and skill adapters
        run: python3 tools/check-agent-setup.py
      - name: Amendment stamps (#97)
        run: python3 tools/check-stamps.py
      - name: Absorption stamps (#126)
        run: python3 tools/check-absorption.py
