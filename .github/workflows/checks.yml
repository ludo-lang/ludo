name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ADR-0051 §6: a convention in docs/agents/ ships with a checker.
      - name: Amendment stamps (#97)
        run: python3 tools/check-stamps.py
      - name: Absorption stamps (#126)
        run: python3 tools/check-absorption.py
