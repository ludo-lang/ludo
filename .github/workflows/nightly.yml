name: nightly

# Valgrind is CI-only because it is effectively dead on Apple Silicon, and it is
# a backstop for ASan here rather than a primary (#131).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  ZIG_VERSION: "0.15.1"

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # No sanitizers: Valgrind and ASan do not coexist.
      - name: Build the suite unsanitized
        run: make test
      - name: Valgrind over the suite
        run: |
          set -e
          for t in build/test_*; do
            echo "valgrind $t"
            valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite "$t"
          done

  # The long fuzz run (#131), against the target that landed with the lexer
  # (#141). Its committed corpus under src/frontend/tests/corpus/lexer/ is the
  # regression suite, replayed by every `make check`; this job looks for new
  # findings, and a kept one is minimised and committed by hand.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libFuzzer comes with an LLVM clang, not with zig cc.
      - name: Install clang with libFuzzer
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: Fuzz the lexer
        run: make fuzz FUZZ_CC=clang-18 FUZZ_TIME=1800
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-lexer-crash
          path: |
            crash-*
            leak-*
            timeout-*
