name: nightly

# Valgrind is CI-only because it is effectively dead on Apple Silicon, and it is
# a backstop for ASan here rather than a primary (#131).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  ZIG_VERSION: "0.15.1"

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # No sanitizers: Valgrind and ASan do not coexist.
      - name: Build the suite unsanitized
        run: make test
      - name: Valgrind over the suite
        run: |
          set -e
          for t in build/test_*; do
            echo "valgrind $t"
            valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite "$t"
          done

  # The long fuzz run (#131), against the target that landed with the lexer
  # (#141). Its committed corpus under src/frontend/tests/corpus/lexer/ is the
  # regression suite, replayed by every `make check`; this job looks for new
  # findings, and a kept one is minimised and committed by hand.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [lexer, parser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libFuzzer comes with an LLVM clang, not with zig cc.
      - name: Install clang with libFuzzer
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: Fuzz the ${{ matrix.target }}
        run: make fuzz-${{ matrix.target }} FUZZ_CC=clang-18 FUZZ_TIME=1800
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: |
            crash-*
            leak-*
            timeout-*

  # A failure lands in the tracker rather than in an email (#131's backstop
  # only works if someone hears it): one open issue per failing job, commented
  # on by later failures. The fixing PR closes it with `Fixes #n`; a green
  # night does not, so a flaky finding is not closed unread.
  report:
    needs: [valgrind, fuzz]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    strategy:
      matrix:
        job: [valgrind, fuzz]
    steps:
      - if: needs[matrix.job].result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB: ${{ matrix.job }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="nightly: $JOB failing"
          n=$(gh issue list --state open --search "\"$title\" in:title" \
                --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Still failing: $RUN"
            exit 0
          fi
          body="The nightly \`$JOB\` job failed: $RUN

          Close this from the fixing PR with \`Fixes #<this issue>\`; a green night does not close it."
          if [ "$JOB" = fuzz ]; then
            body="$body

          A fuzz finding is kept by hand: download the \`fuzz-lexer-crash\` artifact, minimise it and commit it to \`src/frontend/tests/corpus/lexer/\`, so every \`make check\` replays it."
          fi
          gh issue create --title "$title" --label needs-triage --label bug --body "$body"
